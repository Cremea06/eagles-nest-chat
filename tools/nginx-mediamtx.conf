# CHG-177: nginx location blocks to add inside the chat.afirstflag.com HTTPS server {} block.
# Exposes MediaMTX WHIP/WHEP over HTTPS at /mtx/ while keeping port 8889 loopback-only
# and blocking external access to the internal MediaMTX HTTP auth hook.

    # Never expose the internal MediaMTX HTTP auth hook externally
    location = /api/mediamtx/auth {
        return 404;
    }

    # MediaMTX WHIP/WHEP reverse proxy (https://chat.afirstflag.com/mtx/live/<streamkey>/whip|whep)
    location /mtx/ {
        proxy_pass http://127.0.0.1:8889/;
        proxy_redirect / /mtx/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 30s;
    }
