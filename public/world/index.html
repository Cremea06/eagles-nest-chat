<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nest World — door</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1220;
      --panel: rgba(15, 23, 42, 0.92);
      --line: rgba(148, 163, 184, 0.28);
      --text: #e5eefc;
      --muted: #94a3b8;
      --ok: #86efac;
      --bad: #fca5a5;
      --accent: #93c5fd;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      background:
        radial-gradient(1200px 600px at 50% -10%, rgba(59, 130, 246, 0.18), transparent 60%),
        var(--bg);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .door {
      width: min(440px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 28px 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }
    h1 {
      margin: 0 0 6px;
      font-size: 1.35rem;
      letter-spacing: 0.02em;
    }
    .sub {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .handle {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 1.05rem;
      color: var(--accent);
      min-height: 1.4em;
      margin-bottom: 14px;
      word-break: break-word;
    }
    .status {
      font-size: 0.98rem;
      line-height: 1.45;
      min-height: 2.4em;
    }
    .status.ok { color: var(--ok); }
    .status.bad { color: var(--bad); }
    .status.wait { color: var(--muted); }
    .roster-wrap {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }
    .roster-wrap h2 {
      margin: 0 0 8px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    #player-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 6px;
    }
    #player-list li {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.92rem;
      padding: 8px 10px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    #player-list li.self {
      border-color: rgba(147, 197, 253, 0.45);
      color: var(--accent);
    }
    #player-list:empty::after {
      content: "No one in the nest yet.";
      color: var(--muted);
      font-size: 0.9rem;
    }
    .hint {
      margin-top: 18px;
      font-size: 0.8rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="door" aria-live="polite">
    <h1>Nest World — door</h1>
    <p class="sub">Presence only. Scene comes later.</p>
    <div class="handle" id="handle">—</div>
    <div class="status wait" id="status">Waiting for pass…</div>
    <div class="roster-wrap" id="roster-wrap" hidden>
      <h2>In the nest</h2>
      <ul id="player-list"></ul>
    </div>
    <p class="hint">Open this page from a /nest link. No second login.</p>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    (function () {
      var handleEl = document.getElementById('handle');
      var statusEl = document.getElementById('status');
      var rosterWrap = document.getElementById('roster-wrap');
      var listEl = document.getElementById('player-list');
      var myHandle = '';
      var myId = '';
      var players = {}; // id -> handle

      function setStatus(text, kind) {
        statusEl.textContent = text;
        statusEl.className = 'status ' + (kind || 'wait');
      }

      function renderRoster() {
        var ids = Object.keys(players);
        listEl.innerHTML = '';
        ids.sort(function (a, b) {
          return String(players[a]).localeCompare(String(players[b]));
        });
        ids.forEach(function (id) {
          var li = document.createElement('li');
          var name = players[id] || id;
          li.textContent = name;
          if (id === myId || (myHandle && name === myHandle)) li.className = 'self';
          listEl.appendChild(li);
        });
        rosterWrap.hidden = false;
      }

      var params = new URLSearchParams(window.location.search);
      var token = params.get('token');

      if (!token) {
        setStatus('No pass on this link. Go back to chat and type /nest.', 'bad');
        console.log('[world] fail: missing token');
        return;
      }

      setStatus('Connecting to Nest World…', 'wait');
      console.log('[world] connecting /nest with token');

      var socket = io('/nest', {
        transports: ['websocket', 'polling'],
        query: { token: token }
      });

      socket.on('joined', function (data) {
        myHandle = (data && data.handle) || '';
        myId = socket.id || '';
        handleEl.textContent = myHandle || '(unknown)';
        setStatus('You are in Nest World (door). Scene comes later.', 'ok');
        console.log('[world] join', myHandle);
      });

      socket.on('currentPlayers', function (roster) {
        players = {};
        (roster || []).forEach(function (p) {
          if (p && p.id) players[p.id] = p.handle || p.id;
        });
        if (!myId && socket.id) myId = socket.id;
        renderRoster();
        console.log('[world] currentPlayers', Object.keys(players).length);
      });

      socket.on('playerJoined', function (p) {
        if (!p || !p.id) return;
        players[p.id] = p.handle || p.id;
        renderRoster();
        console.log('[world] playerJoined', p.handle);
      });

      socket.on('playerLeft', function (p) {
        if (!p || !p.id) return;
        delete players[p.id];
        renderRoster();
        console.log('[world] playerLeft', p.id);
      });

      socket.on('connect_error', function (err) {
        var reason = (err && err.message) ? err.message : 'connect_error';
        setStatus('Could not enter: ' + reason, 'bad');
        console.log('[world] fail', reason);
      });

      socket.on('disconnect', function (reason) {
        console.log('[world] disconnect', reason);
      });
    })();
  </script>
</body>
</html>
