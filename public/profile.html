<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Profile · Milliway</title>
  <link rel="stylesheet" href="/profile.css" />
</head>
<body>
  <main id="card" class="glass" aria-live="polite">
    <p class="kicker">Milliway member</p>
    <h1 id="name">Loading…</h1>
    <p id="tier" class="tier" hidden></p>
    <p id="joined" class="joined"></p>
    <p id="xline" class="xline" hidden>X: <a id="xlink" rel="nofollow noopener noreferrer ugc" target="_blank"></a> <span id="xunv" class="xunv" title="Claimed by the member; not verified by Milliway.">(unverified)</span></p>
    <p id="xnote" class="xnote" hidden>Claimed by the member; not verified by Milliway.</p>
    <p class="back"><a href="/">Back to chat</a></p>
  </main>
  <script src="/profile.js"></script>
</body>
</html>
